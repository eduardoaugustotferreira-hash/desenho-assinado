
name: ci

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Procura segredos versionados
        run: |
          prefix="GOC"
          pattern="${prefix}SPX-|client_secret[[:space:]]*=[[:space:]]*['\"][^'\"]+"

          if git grep -nE "$pattern" -- . ':!*.md'; then
            echo "::error::Possível segredo no repositório"
            exit 1
          fi

      - name: Aplica as migrações D1 em SQLite local
        run: |
          set -e
          for f in migrations/*.sql; do
            sqlite3 teste.db < "$f"
          done
          sqlite3 teste.db ".tables"

      - name: Valida HTML
        run: npx --yes htmlhint "**/*.html"
