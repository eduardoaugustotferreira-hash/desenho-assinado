
name: Migrar D1

on:
  push:
    branches:
      - main
    paths:
      - 'migrations/**'

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Aplicar migracoes no D1 remoto
        run: npx --yes wrangler@4 d1 migrations apply desenho-assinado-db --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
