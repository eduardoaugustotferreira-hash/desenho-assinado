<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <header>
      <h1>Desenho Assinado</h1>
      <p>
        Escolha um número entre 1 e 100.
        Seu desenho será assinado com o e-mail
        da sua conta Google.
      </p>
    </header>

    <section>
      <h2>Autenticação Google</h2>
      <p>Entre com sua conta Google para continuar.</p>

      <div id="google-login"></div>
    </section>

    <form id="formulario" novalidate>
      <label for="numero">Número</label>

      <input
        id="numero"
        name="numero"
        type="number"
        min="1"
        max="100"
        step="1"
        required
        placeholder="42"
      >

      <button type="submit" disabled>
        Desenhar
      </button>
    </form>

    <p id="mensagem" role="alert"></p>

    <figure id="desenho" aria-live="polite"></figure>

    <button id="baixar" type="button" hidden>
      Baixar SVG
    </button>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
